# Fail open during outages; PVC validation is a backstop when available.
#
# Without cert-manager, set both caBundles from the CA signing
# snapshot-topology-webhook-certs.

---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: snapshot-topology.snapshot.storage.k8s.io
  annotations:
    cert-manager.io/inject-ca-from: kube-system/snapshot-topology-webhook
webhooks:
  - name: pods.snapshot-topology.snapshot.storage.k8s.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    reinvocationPolicy: IfNeeded
    clientConfig:
      service:
        name: snapshot-topology-webhook
        namespace: kube-system
        path: /mutate-pods
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system"]
    # Webhooks skipped on the first pass are not reinvoked. Pods gaining their
    # first claim later rely on PVC validation.
    matchConditions:
      - name: has-claim-volume
        expression: >-
          has(object.spec.volumes) &&
          object.spec.volumes.exists(v, has(v.persistentVolumeClaim) || has(v.ephemeral))

---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: snapshot-topology.snapshot.storage.k8s.io
  annotations:
    cert-manager.io/inject-ca-from: kube-system/snapshot-topology-webhook
webhooks:
  - name: persistentvolumeclaims.snapshot-topology.snapshot.storage.k8s.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    clientConfig:
      service:
        name: snapshot-topology-webhook
        namespace: kube-system
        path: /validate-pvcs
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["persistentvolumeclaims"]
        scope: Namespaced
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system"]
    matchConditions:
      - name: restores-from-snapshot
        expression: >-
          has(object.spec.dataSource) && object.spec.dataSource.kind == 'VolumeSnapshot'
      - name: selected-node-changed
        expression: >-
          has(object.metadata.annotations) &&
          'volume.kubernetes.io/selected-node' in object.metadata.annotations &&
          (!has(oldObject.metadata.annotations) ||
           !('volume.kubernetes.io/selected-node' in oldObject.metadata.annotations) ||
           oldObject.metadata.annotations['volume.kubernetes.io/selected-node'] !=
             object.metadata.annotations['volume.kubernetes.io/selected-node'])

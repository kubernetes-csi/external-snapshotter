---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: snapshot-topology-webhook
  namespace: kube-system

---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: snapshot-topology-webhook-runner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: snapshot-topology-webhook-role
subjects:
  - kind: ServiceAccount
    name: snapshot-topology-webhook
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: snapshot-topology-webhook-runner
  apiGroup: rbac.authorization.k8s.io

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: snapshot-topology-webhook-leaderelection
  namespace: kube-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: snapshot-topology-webhook-leaderelection
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: snapshot-topology-webhook
    namespace: kube-system
roleRef:
  kind: Role
  name: snapshot-topology-webhook-leaderelection
  apiGroup: rbac.authorization.k8s.io

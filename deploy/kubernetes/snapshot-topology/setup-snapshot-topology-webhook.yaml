# Every replica serves admission; only the leader reconciles gated pods.
#
# Provision snapshot-topology-webhook-certs via ../snapshot-topology-cert-manager
# or deploy/kubernetes/webhook-example/create-cert.sh.

---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: snapshot-topology-webhook
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: snapshot-topology-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snapshot-topology-webhook
    spec:
      serviceAccountName: snapshot-topology-webhook
      priorityClassName: system-cluster-critical
      # Longer than --shutdown-delay plus the drain timeout.
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: snapshot-topology-webhook
      containers:
        - name: snapshot-topology-webhook
          image: registry.k8s.io/sig-storage/snapshot-topology-webhook:v8.6.0
          args:
            - "--v=5"
            - "--leader-election=true"
            - "--feature-gates=VolumeSnapshotTopology=true"
            - "--tls-cert-file=/etc/snapshot-topology-webhook/certs/tls.crt"
            - "--tls-private-key-file=/etc/snapshot-topology-webhook/certs/tls.key"
          ports:
            - containerPort: 443
          # Wait for informer caches before routing admission requests.
          readinessProbe:
            httpGet:
              path: /readyz
              port: 443
              scheme: HTTPS
            periodSeconds: 2
          volumeMounts:
            - name: certs
              mountPath: /etc/snapshot-topology-webhook/certs
              readOnly: true
          imagePullPolicy: IfNotPresent
      volumes:
        - name: certs
          secret:
            secretName: snapshot-topology-webhook-certs

---
apiVersion: v1
kind: Service
metadata:
  name: snapshot-topology-webhook
  namespace: kube-system
spec:
  selector:
    app.kubernetes.io/name: snapshot-topology-webhook
  ports:
    - protocol: TCP
      port: 443
      targetPort: 443

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: snapshot-topology-webhook
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snapshot-topology-webhook
